version: '3.8'

services:
  app:
    build: .
    container_name: it_helpdesk_app
    restart: always
    volumes:
      - .:/var/www/html
      - ./it_uploads:/var/www/html/it_uploads

  webserver:
    image: nginx:alpine
    container_name: it_helpdesk_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
