version: '3.8'

services:
  app:
    build: .
    container_name: it_helpdesk_app
    restart: always
    volumes:
      - .:/var/www/html
    # PHP-FPM सुरू होताच it_tickets.json तयार करून त्याला ऑटोमॅटिक Write Permission (666) देईल:
    command: >
      sh -c "touch /var/www/html/it_tickets.json &&
             chmod 666 /var/www/html/it_tickets.json &&
             php-fpm"

  web:
    image: nginx:alpine
    container_name: it_helpdesk_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
