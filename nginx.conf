server {
    listen 80;
    server_name it.swarnshilp.com 192.168.130.8 localhost;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 50M;

    # Clean URL routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Route /it/ to root or index.php
    location /it/ {
        rewrite ^/it/(.*)$ /$1 last;
    }

    # Route backend endpoints correctly
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Static uploads access
    location /it_uploads/ {
        alias /var/www/html/it_uploads/;
    }
}
